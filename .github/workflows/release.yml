name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build Swift media helpers
        run: |
          xcrun --sdk macosx swiftc -O -target x86_64-apple-macos10.15 -o internal/mediactl/darwin/darwin-amd64 internal/mediactl/mac_player_helper.swift
          xcrun --sdk macosx swiftc -O -target arm64-apple-macos11 -o internal/mediactl/darwin/darwin-arm64 internal/mediactl/mac_player_helper.swift
      - name: Build macOS release archives
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.20.1
          args: release --clean --skip=publish --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-macos
          path: |
            dist/*.tar.gz
            dist/homebrew/Casks/amp-tui.rb
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build Linux release archives
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.20.1
          args: release --clean --skip=publish --config .goreleaser-linux.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --repo "$GITHUB_REPOSITORY" --generate-notes
      - name: Update Homebrew tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/sfate/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Casks
          cp dist/amp-tui.rb /tmp/homebrew-tap/Casks/amp-tui.rb
          cd /tmp/homebrew-tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Casks/amp-tui.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update amp-tui to ${TAG}"
            git push
          fi
